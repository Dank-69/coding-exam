<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 3 Agent | On-Call Assistant</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">
        <span class="brand-mark">OC</span>
        <span>On-Call Assistant</span>
    </a>
    <nav class="phase-nav" aria-label="阶段导航">
        <a class="nav-link" href="/v1">v1 搜索</a>
        <a class="nav-link" href="/v2">v2 语义</a>
        <a class="nav-link active" href="/v3">v3 Agent</a>
    </nav>
</header>

<main class="page-shell">
    <section class="workbench">
        <div class="section-heading">
            <div>
                <p class="eyebrow">Phase 3</p>
                <h1>On-Call Agent</h1>
                <p class="section-copy">通过对话定位 SOP，实时展示 readFile 工具调用和工具返回结果。</p>
            </div>
            <a class="secondary-action" href="/">返回主界面</a>
        </div>
    </section>

    <section class="agent-layout">
        <div class="panel chat-panel">
            <div class="panel-header">
                <h2>对话</h2>
                <span id="streamState" class="counter">idle</span>
            </div>
            <div id="chatLog" class="chat-log">
                <div class="bubble assistant">
                    输入 On-Call 问题后，我会定位相关 SOP 并展示 tool_call / tool_result。
                </div>
            </div>
            <form id="chatForm" class="chat-form">
                <label class="input-wrap compact" for="messageInput">
                    <span>问题</span>
                    <input id="messageInput" type="text" th:value="${message}" placeholder="例如：js 文件不见了、测试环境全挂了、模型效果下降" autocomplete="off">
                </label>
                <button class="primary-action" type="submit">发送</button>
            </form>
        </div>

        <aside class="panel trace-panel">
            <div class="panel-header">
                <h2>工具调用链</h2>
                <span class="counter">trace</span>
            </div>
            <div id="traceItems" class="trace-items">
                <p class="empty-state">等待 Agent 调用工具。</p>
            </div>
        </aside>
    </section>
</main>

<script>
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const chatLog = document.getElementById("chatLog");
    const traceItems = document.getElementById("traceItems");
    const streamState = document.getElementById("streamState");
    let currentStreamController = null;
    const conversationHistory = [];

    function escapeHtml(value) {
        return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
    }

    function appendBubble(role, text) {
        const node = document.createElement("div");
        node.className = `bubble ${role}`;
        node.innerHTML = escapeHtml(text);
        chatLog.appendChild(node);
        chatLog.scrollTop = chatLog.scrollHeight;
        return node;
    }

    function appendTrace(type, text) {
        if (traceItems.querySelector(".empty-state")) {
            traceItems.innerHTML = "";
        }
        const node = document.createElement("div");
        node.className = `trace-item trace-${type}`;
        node.innerHTML = `<strong>${escapeHtml(type)}</strong><pre>${escapeHtml(text)}</pre>`;
        traceItems.appendChild(node);
        traceItems.scrollTop = traceItems.scrollHeight;
    }

    function resetTrace() {
        traceItems.innerHTML = '<p class="empty-state">正在等待工具调用。</p>';
    }

    function compactHistory() {
        return conversationHistory.slice(-8).map((item) => ({
            role: item.role,
            content: String(item.content || "").slice(0, 1500)
        }));
    }

    function handleStreamEvent(type, data, botBubble, answerLines) {
        if (type === "thinking") {
            botBubble.textContent = data;
            appendTrace("thinking", data);
        } else if (type === "tool_call") {
            appendTrace("tool_call", data);
        } else if (type === "tool_result") {
            appendTrace("tool_result", data);
        } else if (type === "message") {
            answerLines.push(data);
            botBubble.textContent = answerLines.join("\n");
        } else if (type === "done") {
            appendTrace("done", data);
            conversationHistory.push({role: "assistant", content: answerLines.join("\n")});
            streamState.textContent = "done";
        } else if (type === "error") {
            appendTrace("error", data || "stream error");
            botBubble.textContent = data || "Agent 对话失败，请重试。";
            streamState.textContent = "error";
        }
    }

    function consumeSseBlock(block, botBubble, answerLines) {
        let type = "message";
        const dataLines = [];
        for (const line of block.split(/\r?\n/)) {
            if (line.startsWith("event:")) {
                type = line.slice(6).trim() || "message";
            } else if (line.startsWith("data:")) {
                dataLines.push(line.slice(5).trimStart());
            }
        }
        handleStreamEvent(type, dataLines.join("\n"), botBubble, answerLines);
    }

    function startChat(message) {
        const q = (message || "").trim();
        if (!q) {
            return;
        }
        if (currentStreamController) {
            currentStreamController.abort();
        }
        const requestHistory = compactHistory();
        appendBubble("user", q);
        conversationHistory.push({role: "user", content: q});
        resetTrace();
        streamState.textContent = "streaming";
        const answerLines = [];

        const botBubble = appendBubble("assistant", "正在分析问题...");
        const controller = new AbortController();
        currentStreamController = controller;

        fetch("/v3/chat/stream", {
            method: "POST",
            headers: {
                "Accept": "text/event-stream",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({message: q, history: requestHistory}),
            signal: controller.signal
        }).then(async (response) => {
            if (!response.ok || !response.body) {
                throw new Error(`stream request failed: ${response.status}`);
            }
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            while (true) {
                const {value, done} = await reader.read();
                if (done) {
                    break;
                }
                buffer += decoder.decode(value, {stream: true});
                const blocks = buffer.split(/\r?\n\r?\n/);
                buffer = blocks.pop() || "";
                for (const block of blocks) {
                    if (block.trim()) {
                        consumeSseBlock(block, botBubble, answerLines);
                    }
                }
            }
            buffer += decoder.decode();
            if (buffer.trim()) {
                consumeSseBlock(buffer, botBubble, answerLines);
            }
        }).catch((error) => {
            if (error.name === "AbortError") {
                return;
            }
            appendTrace("error", error.message || "stream error");
            botBubble.textContent = error.message || "Agent 对话失败，请重试。";
            streamState.textContent = "error";
        }).finally(() => {
            if (currentStreamController === controller) {
                currentStreamController = null;
            }
        });
    }

    chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        startChat(messageInput.value);
    });

    if (messageInput.value && messageInput.value.trim()) {
        startChat(messageInput.value);
    }
</script>
</body>
</html>
